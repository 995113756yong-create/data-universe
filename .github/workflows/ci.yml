name: ci
on:
  push:
  pull_request:

jobs:
  collectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: for f in scripts/verify.sh infra/redpanda/create_topics.sh; do bash -n "$f"; done
