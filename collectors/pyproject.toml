[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "du-collectors"
version = "0.1.0"
description = "Data Universe realtime collectors (USGS earthquakes, Wikipedia edits)"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
du-collectors = "collectors.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collectors.wiki" = ["lang_region.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
